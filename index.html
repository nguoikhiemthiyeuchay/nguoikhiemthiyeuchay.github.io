<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tham Gia - Người Khiếm Thị Yêu Chạy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Màu vàng dịu (Golden/Amber) */
            --primary-color: #f1c40f;
            --primary-hover: #f39c12;
            --secondary-color: #2ecc71;
            /* Xanh lá bổ trợ */
            --dark-color: #2c3e50;
            --text-on-primary: #2d3436;
            /* Chữ màu tối trên nền vàng */
            --light-color: #f9f9f9;
            --white: #ffffff;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fef9e7 0%, #f0f3f4 100%);
            color: var(--dark-color);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            /* Mở rộng chiều ngang */
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            /* Gradient vàng dịu */
            background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
            color: var(--text-on-primary);
            padding: 25px 30px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .header p {
            opacity: 0.85;
            font-size: 1rem;
            font-weight: 500;
        }

        form {
            padding: 25px 30px;
            display: grid;
            /* 3 cột để tận dụng chiều ngang */
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        /* Responsive Grid */
        @media (max-width: 900px) {
            form {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 600px) {
            form {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        /* Span toàn bộ chiều rộng (3 cột) */
        .full-width {
            grid-column: 1 / -1;
        }

        label {
            margin-bottom: 6px;
            font-weight: 600;
            color: #555;
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        textarea,
        select {
            padding: 10px 12px;
            border: 1px solid #dfe6e9;
            border-radius: 6px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            outline: none;
            background-color: #fafbfc;
            width: 100%;
        }

        input:focus,
        textarea:focus {
            border-color: var(--primary-color);
            background-color: var(--white);
            box-shadow: 0 0 0 3px rgba(241, 196, 15, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
            /* Giảm chiều cao mặc định */
        }

        .radio-group,
        .checkbox-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            background: #fdfdfd;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #dfe6e9;
            transition: all 0.2s;
            font-size: 0.9rem;
            flex: 1;
            /* Chia đều không gian */
            min-width: 120px;
        }

        .radio-option:hover {
            border-color: var(--primary-color);
            background: #fef9e7;
        }

        input[type="radio"],
        input[type="checkbox"] {
            accent-color: var(--primary-hover);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .btn-submit {
            grid-column: 1 / -1;
            background: var(--primary-color);
            color: var(--text-on-primary);
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }

        /* Loading Spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top-color: var(--dark-color);
            animation: spin 0.8s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #bbb;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <h1>Đăng Ký Tham Gia</h1>
            <p>Sự kiện chạy bộ đồng hành cùng người khiếm thị</p>
        </div>

        <form id="registrationForm">
            <!-- Dòng 1: Thông tin định danh (3 cột) -->
            <div class="form-group">
                <label for="fullname">Họ và tên *</label>
                <input type="text" id="fullname" name="fullname" placeholder="Nguyễn Văn A" required>
            </div>

            <div class="form-group">
                <label for="phone">Số điện thoại *</label>
                <input type="tel" id="phone" name="phone" placeholder="09xxxxxxxxx" required pattern="[0-9]{10}">
            </div>

            <div class="form-group">
                <label for="cccd">Số CCCD *</label>
                <input type="text" id="cccd" name="cccd" required>
            </div>

            <!-- Dòng 2: Thông tin cá nhân (3 cột) -->
            <div class="form-group">
                <label for="birthdate">Ngày sinh *</label>
                <input type="date" id="birthdate" name="birthdate" required>
            </div>

            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" placeholder="email@example.com" required>
            </div>

            <div class="form-group">
                <label for="address">Địa chỉ *</label>
                <input type="text" id="address" name="address" required>
            </div>

            <!-- Dòng 3: Khảo sát (Chia cột gọn hơn) -->
            <div class="form-group">
                <label>Lịch sử chạy bộ</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="run_history" value="Chưa từng" checked>
                        <span>Chưa từng</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="run_history" value="Đã từng tham gia">
                        <span>Đã từng</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Vai trò tham gia *</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="role" value="pacer" required>
                        <span>Pacer</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="role" value="blind_runner">
                        <span>Blind Runner</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Hoạt động khác</label>
                <div class="checkbox-group">
                    <label class="radio-option">
                        <input type="checkbox" name="join_party" value="Có">
                        <span>Tham gia liên hoan</span>
                    </label>
                </div>
            </div>

            <!-- Dòng 4: Ghi chú (Full width) -->
            <div class="form-group full-width">
                <label for="medical_condition">Lưu ý sức khỏe / Bệnh nền</label>
                <input type="text" id="medical_condition" name="medical_condition" placeholder="Để trống nếu không có">
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit">
                <span>Gửi Đăng Ký</span>
                <div class="spinner"></div>
            </button>
        </form>
    </div>

    <script>
        const form = document.querySelector('#registrationForm');
        // URL Web App của bạn
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwp1tHVXYkUfRIplI4g1lz7PjRlvuwj1pw8Z--ABMMPlPFrklY68hoEoMPNIPW7VZol/exec';
        form.addEventListener('submit', function (e) {
            e.preventDefault();

            const btn = document.querySelector('.btn-submit');
            const btnText = btn.querySelector('span');
            const spinner = btn.querySelector('.spinner');

            // Tạo vùng hiển thị thông báo nếu chưa có
            let statusDiv = document.getElementById('statusMessage');
            if (!statusDiv) {
                statusDiv = document.createElement('div');
                statusDiv.id = 'statusMessage';
                statusDiv.style.marginTop = '15px';
                statusDiv.style.padding = '10px';
                statusDiv.style.borderRadius = '5px';
                statusDiv.style.fontWeight = 'bold';
                statusDiv.style.textAlign = 'center';
                statusDiv.style.display = 'none';
                form.appendChild(statusDiv);
            }

            // Reset thông báo cũ
            statusDiv.style.display = 'none';
            statusDiv.className = '';
            statusDiv.innerHTML = '';

            // 1. Hiệu ứng Loading
            btnText.style.display = 'none';
            spinner.style.display = 'block';
            btn.disabled = true;
            btn.style.opacity = '0.7';

            // 2. Thu thập dữ liệu
            const formData = new FormData(form);

            // 3. Gửi Dữ liệu
            fetch(SCRIPT_URL, {
                method: 'POST',
                body: formData
            })
                .then(response => {
                    return response.json();
                })
                .then(data => {
                    if (data.result === 'success') {
                        // Thành công
                        statusDiv.style.display = 'block';
                        statusDiv.style.backgroundColor = '#d4edda';
                        statusDiv.style.color = '#155724';
                        statusDiv.style.border = '1px solid #c3e6cb';
                        statusDiv.innerText = '✅ Đăng ký thành công! Cảm ơn bạn.';
                        form.reset();
                    } else {
                        throw new Error(data.message || 'Lỗi từ Server');
                    }
                })
                .catch(error => {
                    console.error('Lỗi chi tiết:', error);

                    // Hiển thị lỗi
                    statusDiv.style.display = 'block';
                    statusDiv.style.backgroundColor = '#f8d7da';
                    statusDiv.style.color = '#721c24';
                    statusDiv.style.border = '1px solid #f5c6cb';

                    let msg = '❌ GỬI THẤT BẠI!<br>';
                    if (error.message.includes('Failed to fetch') || error.message.includes('NetworkError')) {
                        msg += '⚠️ <b>Lỗi kết nối / CORS / URL sai.</b><br>';
                        msg += 'Hãy kiểm tra:<br>';
                        msg += '1. URL Script có đúng không? (Thử paste vào trình duyệt xem chạy không)<br>';
                        msg += '2. Đã chọn "Anyone" khi Deploy chưa?<br>';
                    } else {
                        msg += error.message;
                    }
                    statusDiv.innerHTML = msg;
                })
                .finally(() => {
                    // Reset nút bấm
                    btnText.style.display = 'block';
                    spinner.style.display = 'none';
                    btn.disabled = false;
                    btn.style.opacity = '1';
                });
        });
    </script>
</body>

</html>
