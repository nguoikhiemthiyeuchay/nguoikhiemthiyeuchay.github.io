<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tham Gia - Người Khiếm Thị Yêu Chạy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ff6b6b;
            /* Màu cam san hô năng động */
            --secondary-color: #4ecdc4;
            /* Màu xanh ngọc */
            --dark-color: #2d3436;
            --light-color: #f7f9fc;
            --white: #ffffff;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            color: var(--dark-color);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, var(--primary-color), #ee5253);
            color: var(--white);
            padding: 40px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.1);
            pointer-events: none;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        form {
            padding: 40px 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        @media (max-width: 768px) {
            form {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
            font-size: 0.95rem;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        input[type="number"],
        textarea,
        select {
            padding: 12px 15px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
            background-color: #fafbfc;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: var(--primary-color);
            background-color: var(--white);
            box-shadow: 0 0 0 4px rgba(255, 107, 107, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .radio-group,
        .checkbox-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            padding-top: 5px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            background: #f8f9fa;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #e1e8ed;
            transition: all 0.2s;
        }

        .radio-option:hover {
            border-color: var(--secondary-color);
            background: #e3fafc;
        }

        input[type="radio"],
        input[type="checkbox"] {
            accent-color: var(--primary-color);
            width: 18px;
            height: 18px;
        }

        .btn-submit {
            grid-column: 1 / -1;
            background: var(--dark-color);
            color: var(--white);
            border: none;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-submit:hover {
            background: #000;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Loading Spinner */
        .spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .header {
                padding: 30px 20px;
            }

            form {
                padding: 30px 20px;
            }

            .radio-option {
                width: 100%;
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #aaa;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <h1>Đăng Ký Tham Gia</h1>
            <p>Sự kiện chạy bộ đồng hành cùng người khiếm thị</p>
        </div>

        <form id="registrationForm">
            <!-- 1. Họ và tên -->
            <div class="form-group">
                <label for="fullname">Họ và tên *</label>
                <input type="text" id="fullname" name="fullname" placeholder="Nhập họ và tên của bạn" required>
            </div>

            <!-- 2. Số điện thoại -->
            <div class="form-group">
                <label for="phone">Số điện thoại *</label>
                <input type="tel" id="phone" name="phone" placeholder="09xxxxxxxxx" required pattern="[0-9]{10}">
            </div>

            <!-- 3. Số CCCD -->
            <div class="form-group">
                <label for="cccd">Số CCCD *</label>
                <input type="text" id="cccd" name="cccd" placeholder="Số căn cước công dân" required>
            </div>

            <!-- 4. Ngày sinh -->
            <div class="form-group">
                <label for="birthdate">Ngày sinh *</label>
                <input type="date" id="birthdate" name="birthdate" required>
            </div>

            <!-- 5. Email -->
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
            </div>

            <!-- 6. Địa chỉ -->
            <div class="form-group">
                <label for="address">Địa chỉ liên hệ *</label>
                <input type="text" id="address" name="address" placeholder="Quận/Huyện, Tỉnh/Thành phố" required>
            </div>

            <!-- 7. Lịch sử chạy -->
            <div class="form-group full-width">
                <label>Bạn đã từng tham gia giải chạy bộ nào chưa?</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="run_history" value="Chưa từng" checked>
                        <span>Chưa từng</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="run_history" value="Đã từng tham gia">
                        <span>Đã từng tham gia</span>
                    </label>
                </div>
            </div>

            <!-- 8. Vai trò -->
            <div class="form-group full-width">
                <label>Bạn muốn tham gia với vai trò gì? *</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="role" value="pacer" required>
                        <span>Người dẫn đường (Pacer)</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="role" value="blind_runner">
                        <span>Vận động viên (Blind Runner)</span>
                    </label>
                </div>
            </div>

            <!-- 9. Bệnh nền -->
            <div class="form-group full-width">
                <label for="medical_condition">Bạn có bệnh nền hoặc lưu ý sức khỏe nào không?</label>
                <textarea id="medical_condition" name="medical_condition"
                    placeholder="Nếu không có, vui lòng để trống hoặc ghi 'Không'."></textarea>
            </div>

            <!-- 10. Liên hoan -->
            <div class="form-group full-width">
                <label>Hoạt động sau sự kiện</label>
                <div class="checkbox-group">
                    <label class="radio-option">
                        <input type="checkbox" name="join_party" value="Có">
                        <span>Tôi sẽ tham gia liên hoan cùng mọi người</span>
                    </label>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit">
                <span>Gửi Đăng Ký</span>
                <div class="spinner"></div>
            </button> <!-- .spinner handled by JS -->
        </form>
    </div>

    <!-- Script xử lý gửi form -->
    <script>
        const form = document.querySelector('#registrationForm');
        // LƯU Ý: Thay thế URL dưới đây bằng URL Web App thực tế của bạn sau khi deploy Google Script
        const SCRIPT_URL = 'YOUR_GOOGLE_SCRIPT_WEB_APP_URL_HERE';

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            // Kiểm tra SCRIPT_URL
            if (SCRIPT_URL === 'YOUR_GOOGLE_SCRIPT_WEB_APP_URL_HERE') {
                alert('Vui lòng cập nhật SCRIPT_URL trong mã nguồn (dòng 230) với URL Web App của bạn!');
                return;
            }

            const btn = document.querySelector('.btn-submit');
            const btnText = btn.querySelector('span');
            const spinner = btn.querySelector('.spinner');

            // 1. Hiệu ứng Loading
            btnText.style.display = 'none';
            spinner.style.display = 'block';
            btn.disabled = true;
            btn.style.opacity = '0.7';

            // 2. Thu thập dữ liệu
            const formData = new FormData(form);

            // 3. Gửi Dữ liệu
            fetch(SCRIPT_URL, {
                method: 'POST',
                body: formData
            })
                .then(response => {
                    // Google Apps Script redirect nên đôi khi fetch trả về 'opaque' response nếu mode: 'no-cors'
                    // Tuy nhiên backend.gs trả về JSON, nên ta kỳ vọng 200 OK.
                    // Ở đây ta cứ check đơn giản
                    alert('Đăng ký thành công! Cảm ơn bạn đã tham gia.');
                    form.reset();
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    alert('Có lỗi xảy ra. Vui lòng thử lại sau!');
                })
                .finally(() => {
                    // Reset nút bấm
                    btnText.style.display = 'block';
                    spinner.style.display = 'none';
                    btn.disabled = false;
                    btn.style.opacity = '1';
                });
        });
    </script>
</body>

</html>
